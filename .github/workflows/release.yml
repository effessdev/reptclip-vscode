
name: Publish VS Code Extension

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # ------------------------------------------
  # JOB 1: Build and package the extension
  # ------------------------------------------
  build:
    name: Build VSIX
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository with Git LFS
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download and verify Git LFS files
        run: |
          git lfs pull
          git lfs fsck

      - name: Validate extension metadata and release version
        run: |
          node <<'NODE'
          const p = require('./package.json');

          const expectedPublisher = 'effessdev';
          const expectedName = 'reptclip-for-vscode';
          const tag = process.env.GITHUB_REF_NAME;
          const tagVersion = tag.replace(/^v/, '');

          if (p.publisher !== expectedPublisher) {
            throw new Error(`Wrong publisher: ${p.publisher}`);
          }

          if (p.name !== expectedName) {
            throw new Error(`Wrong extension name: ${p.name}`);
          }

          if (!/^\d+\.\d+\.\d+$/.test(p.version)) {
            throw new Error(`Invalid stable version: ${p.version}`);
          }

          if (p.version !== tagVersion) {
            throw new Error(
              `Version mismatch: package.json=${p.version}, tag=${tag}`
            );
          }

          if (!p.scripts || !p.scripts['vscode:prepublish']) {
            throw new Error('Missing vscode:prepublish script');
          }

          console.log(`Validated ${p.publisher}.${p.name} v${p.version}`);
          NODE

      - name: Package extension
        id: package
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VSIX="reptclip-for-vscode-${VERSION}.vsix"

          npx --yes @vscode/vsce package --out "$VSIX"

          if [ ! -s "$VSIX" ]; then
            echo "VSIX file missing or empty!"
            exit 1
          fi

          echo "vsix=$VSIX" >> "$GITHUB_OUTPUT"

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: extension-vsix
          path: ${{ steps.package.outputs.vsix }}
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------
  # JOB 2: Publish to both marketplaces
  # ------------------------------------------
  publish:
    name: Publish Extensions
    runs-on: ubuntu-latest
    needs: build

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: extension-vsix
          path: dist

      - name: Publish to Visual Studio Marketplace
        run: |
          VSIX=$(find dist -maxdepth 1 -type f -name '*.vsix' -print -quit)

          if [ -z "$VSIX" ]; then
            echo "VSIX artifact not found!"
            exit 1
          fi

          npx --yes @vscode/vsce publish \
            --packagePath "$VSIX" \
            --oidc

      - name: Publish to Open VSX
        run: |
          VSIX=$(find dist -maxdepth 1 -type f -name '*.vsix' -print -quit)

          if [ -z "$VSIX" ]; then
            echo "VSIX artifact not found!"
            exit 1
          fi

          npx --yes ovsx publish \
            "$VSIX" \
            --trusted-publishing
